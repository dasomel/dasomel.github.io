<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1830"/><stop offset="1" stop-color="#142A3B"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06101F" flood-opacity=".45"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#72E3C3"/></marker></defs><rect width="1200" height="480" rx="30" fill="url(#bg)"/><circle cx="1080" cy="50" r="150" fill="#55B8DB" opacity=".08"/><text x="60" y="62" fill="#72E3C3" font-family="monospace" font-size="22" font-weight="700">NFS QUOTA AGENT / ENFORCEMENT FLOW</text><text x="60" y="98" fill="#A9BCC4" font-family="Arial" font-size="16">Kubernetes storage intent → host filesystem enforcement → observable signals</text><g filter="url(#shadow)"><rect x="60" y="165" width="190" height="120" rx="18" fill="#203C5A" stroke="#55B8DB" stroke-width="3"/><rect x="300" y="165" width="210" height="120" rx="18" fill="#263B66" stroke="#9D8CFF" stroke-width="3"/><rect x="560" y="165" width="210" height="120" rx="18" fill="#244D54" stroke="#72E3C3" stroke-width="3"/><rect x="820" y="165" width="160" height="120" rx="18" fill="#4B3C35" stroke="#FFB86B" stroke-width="3"/><rect x="1030" y="165" width="120" height="120" rx="18" fill="#3D315C" stroke="#D6A8FF" stroke-width="3"/></g><g fill="#F4F7F6" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle"><text x="155" y="222">PVC / PV</text><text x="155" y="250" fill="#A9DDF0" font-size="14">requested capacity</text><text x="405" y="220">Agent</text><text x="405" y="250">DaemonSet</text><text x="665" y="220">Quota Adapter</text><text x="665" y="250" fill="#B9F5E5" font-size="14">XFS · ext4 · Btrfs</text><text x="900" y="222">Filesystem</text><text x="900" y="250" fill="#FFD3A5" font-size="14">kernel enforced</text><text x="1090" y="222">Metrics</text><text x="1090" y="250" fill="#E6CFFF" font-size="14">Prometheus</text></g><g fill="none" stroke="#72E3C3" stroke-width="5" marker-end="url(#arrow)"><path d="M250 225h42"/><path d="M510 225h42"/><path d="M770 225h42"/><path d="M980 225h42"/></g><text x="60" y="390" fill="#E5EEF2" font-family="Arial" font-size="22" font-weight="600">Requested PVC capacity becomes an enforceable filesystem quota</text><text x="60" y="422" fill="#A9BCC4" font-family="Arial" font-size="18">while usage, drift and operational history remain visible to the operator.</text></svg>
