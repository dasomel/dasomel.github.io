<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tech Digest</title>
  <desc id="desc">A dark editorial technology digest cover with connected nodes and a reading stream motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1110"/>
      <stop offset="1" stop-color="#14211d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#2f7d68" stroke-width="3" opacity="0.75">
    <path d="M180 590 C420 470, 470 650, 700 520 S1020 420, 1180 300 S1380 260, 1470 170"/>
    <path d="M220 300 C420 390, 520 240, 760 350 S1060 560, 1320 470" opacity="0.55"/>
  </g>
  <g fill="#58c7a5">
    <circle cx="180" cy="590" r="11"/>
    <circle cx="470" cy="620" r="8"/>
    <circle cx="700" cy="520" r="13"/>
    <circle cx="1010" cy="440" r="8"/>
    <circle cx="1180" cy="300" r="12"/>
    <circle cx="1470" cy="170" r="9"/>
  </g>
  <g fill="#dcebe5">
    <text x="120" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" letter-spacing="7" fill="#79d9bc">TECH DIGEST</text>
    <text x="120" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700">signals, sources,</text>
    <text x="120" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700">and context.</text>
  </g>
  <text x="120" y="770" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#7f9b92" letter-spacing="2">OSS WORKBENCH · CURATED TECHNOLOGY</text>
</svg>
