name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: '1'

# A PR gets exactly one validation lane. Pushes to the PR branch are already
# reflected in the pull_request event, so a separate push trigger only creates
# duplicate runs that serialize behind each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile --no-progress
          else
            echo "bun.lock not found — bootstrapping it with Bun."
            bun install --no-progress
          fi

      - name: Unit tests
        run: bun test

      - name: Bun bundle smoke test
        run: bun run build:tools

      - name: Build
        run: bun run build

      - name: Persist generated Bun lockfile
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f bun.lock ] && ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: generate Bun lockfile"
            git push
          else
            echo "No new Bun lockfile changes to persist."
          fi
