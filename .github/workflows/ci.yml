name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile --no-progress
          else
            echo "bun.lock not found — bootstrapping it with Bun."
            bun install --no-progress
          fi

      - name: Unit tests
        run: bun test

      - name: Bun bundle smoke test
        run: bun run build:tools

      - name: Build
        run: bun run build

      - name: Persist generated Bun lockfile
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f bun.lock ]; then
            echo "bun.lock was not generated."
            exit 1
          fi
          if git status --porcelain -- bun.lock | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: generate Bun lockfile"
            git push
          else
            echo "bun.lock already matches the repository."
          fi
