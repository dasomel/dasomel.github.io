name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Unit tests
        run: bun test

      - name: Bun bundle smoke test
        run: bun run build:tools

      - name: Lint
        run: bun run lint

      # Keep CI aligned with the GitHub Pages deployment build. This catches
      # production-only TypeScript/static-generation failures before merge.
      - name: Production build
        run: bun run build
