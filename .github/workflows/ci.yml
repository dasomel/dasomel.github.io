name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile --no-progress
          else
            echo "bun.lock not found — bootstrapping it with Bun."
            bun install --no-progress
          fi

      - name: Unit tests
        run: bun test

      - name: Bun bundle smoke test
        run: bun run build:tools

      - name: Build
        run: bun run build

      - name: Persist generated Bun lockfile
        if: ${{ !cancelled() }}
        env:
          PR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ ! -f bun.lock ]; then
            echo "bun.lock was not generated."
            exit 1
          fi

          if ! git status --porcelain -- bun.lock | grep -q .; then
            echo "bun.lock already matches the repository."
            exit 0
          fi

          # pull_request checks run on a synthetic merge commit. Do not push
          # that detached merge ref. Preserve the generated lockfile, reset to
          # the real PR branch head, then create a lockfile-only commit there.
          cp bun.lock "${RUNNER_TEMP}/bun.lock"
          git fetch origin "$PR_BRANCH" --quiet
          git reset --hard "origin/$PR_BRANCH"
          cp "${RUNNER_TEMP}/bun.lock" bun.lock

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: generate Bun lockfile"
          git push origin "HEAD:$PR_BRANCH"
