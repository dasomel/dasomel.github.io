name: Auto Merge After CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR after successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          if [[ "$HEAD_REF" == daily-digest/* || "$HEAD_REF" == ai-infra-weekly/* ]]; then
            echo "Digest archive and AI Infra Weekly PRs require manual review; skipping generic auto-merge."
            exit 0
          fi

          IS_DRAFT=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$REPO"
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPO" \
            --squash \
            --delete-branch

      - name: Deploy merged main to GitHub Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName' 2>/dev/null || true)
          if [[ "$HEAD_REF" == daily-digest/* || "$HEAD_REF" == ai-infra-weekly/* ]]; then
            echo "Skipping deploy for a review-gated branch."
            exit 0
          fi

          gh workflow run deploy.yml --repo "$REPO" --ref main
