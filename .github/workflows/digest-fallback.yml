name: Digest Fallback Merge

# 보강 태스크가 draft PR 을 그대로 남겨두면 머지해 발행한다.
# 머지할 draft PR 이 없으면 아무 작업도 하지 않는다.

on:
  schedule:
    # 21:45 UTC = 06:45 KST. OpenAI enrichment(21:30/21:55 UTC)가 먼저 실행된 뒤
    # draft PR 을 머지하도록 여유를 둔다. 예전 21:15 UTC는 raw digest를 먼저
    # 머지할 수 있어 AI 보강과 경합했다.
    - cron: '45 21 * * *'
    # 백스톱 슬롯. 일일 수집/보강이 통째로 밀린 날을 회수한다.
    - cron: '05 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # deploy.yml 을 workflow_dispatch 로 깨우기 위해 필요.
  actions: write

concurrency:
  group: digest-fallback
  cancel-in-progress: false

jobs:
  fallback-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Merge pending enriched draft digest PR (if any)
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh pr list \
            --repo "$REPO" \
            --state open \
            --draft \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("daily-digest/"))]
                  | sort_by(.headRefName)[] | "\(.number)\t\(.headRefName)"' > /tmp/digest-prs.txt; then
            echo "::error::gh pr list 실패 — 목록을 가져오지 못했다."
            exit 1
          fi
          echo "대상:"
          cat /tmp/digest-prs.txt

          COUNT=0
          SKIPPED=0
          while IFS=$'\t' read -r NUM BRANCH; do
            [ -z "$NUM" ] && continue
            DATE="${BRANCH#daily-digest/}"
            DATA="src/content/posts/.digest-data/${DATE}.json"

            # 이미 발행된 날짜는 자동 교체하지 않는다.
            if [ -f "src/content/posts/daily-digest-${DATE}.md" ]; then
              echo "::warning::PR #${NUM} (${BRANCH}) — ${DATE} 는 이미 main 에 발행돼 있다. 자동 머지하지 않는다."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # AI 보강을 통과한 다이제스트만 자동 발행한다. 이 관문이 없으면
            # OpenAI enrichment가 아직 끝나지 않은 raw RSS PR을 06:45에 머지하게 된다.
            if [ ! -f "$DATA" ]; then
              echo "::warning::PR #${NUM} (${BRANCH}) — ${DATA} 없음. 자동 머지하지 않는다."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi
            if ! jq -e '
              (.articles | length > 0) and
              (.articles | all(.summaryKo and (.summaryKo | type == "string") and (.summaryKo | length > 0))) and
              (.articles | all(.summaryEn and (.summaryEn | type == "string") and (.summaryEn | length > 0))) and
              (.articles | all(.insightKo and (.insightKo | type == "string") and (.insightKo | length > 0))) and
              (.articles | all(.insightEn and (.insightEn | type == "string") and (.insightEn | length > 0)))
            ' "$DATA" >/dev/null; then
              echo "::warning::PR #${NUM} (${BRANCH}) — AI 보강이 완료되지 않았다. 다음 fallback 슬롯에서 다시 확인한다."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "PR #${NUM} (${BRANCH}) — AI 보강 검증 통과, ready 전환 후 머지..."
            gh pr ready "$NUM" --repo "$REPO"
            gh pr merge "$NUM" \
              --repo "$REPO" \
              --squash \
              --delete-branch \
              --subject "📰 데일리 테크 다이제스트 ${DATE} (OpenAI enriched)"
            COUNT=$((COUNT + 1))
          done < /tmp/digest-prs.txt

          if [ "$COUNT" -eq 0 ]; then
            if [ "$SKIPPED" -gt 0 ]; then
              echo "자동 머지하지 않은 PR ${SKIPPED}건. AI 보강 또는 중복 발행 관문에서 대기 중이다."
            else
              echo "머지할 draft 다이제스트 PR 이 없다."
            fi
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "완료: ${COUNT}건 머지."

      - name: Trigger Pages deploy
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
