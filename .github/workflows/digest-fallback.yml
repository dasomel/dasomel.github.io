name: Digest Fallback Merge

# RSS 수집만 된 draft PR은 자동 발행하지 않는다.
# AI enrichment가 100% 완료된 경우에만 자동 merge한다.

on:
  schedule:
    - cron: '15 21 * * *'
    - cron: '05 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: digest-fallback
  cancel-in-progress: false

jobs:
  fallback-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find pending digest PRs
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh pr list \
            --repo "$REPO" \
            --state open \
            --draft \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("daily-digest/"))]
                  | sort_by(.headRefName)[] | "\(.number)\t\(.headRefName)"' > /tmp/digest-prs.txt; then
            echo "::error::gh pr list 실패 — 자동 발행을 중단한다."
            exit 1
          fi
          cat /tmp/digest-prs.txt

      - name: Gate and merge fully enriched digests
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=0
          BLOCKED=0
          while IFS=$'\t' read -r NUM BRANCH; do
            [ -z "$NUM" ] && continue
            DATE="${BRANCH#daily-digest/}"

            # PR branch를 checkout하여 merge 대상 자체를 검사한다.
            git fetch origin "$BRANCH" --quiet
            git checkout --detach "origin/$BRANCH"

            if ! node scripts/check-enrichment.mjs --strict --date "$DATE"; then
              echo "::warning::PR #${NUM} (${DATE}) — AI enrichment 미완료. 자동 머지하지 않는다."
              BLOCKED=$((BLOCKED + 1))
              continue
            fi

            git checkout --detach origin/main
            if [ -f "src/content/posts/daily-digest-${DATE}.md" ]; then
              echo "::warning::PR #${NUM} (${DATE}) — 이미 main에 발행됨. 자동 머지하지 않는다."
              BLOCKED=$((BLOCKED + 1))
              continue
            fi

            echo "PR #${NUM} (${DATE}) — AI enrichment 100% 확인. merge..."
            gh pr ready "$NUM" --repo "$REPO"
            gh pr merge "$NUM" \
              --repo "$REPO" \
              --squash \
              --delete-branch \
              --subject "📰 데일리 테크 다이제스트 ${DATE}"
            COUNT=$((COUNT + 1))
          done < /tmp/digest-prs.txt

          echo "merged=$COUNT blocked=$BLOCKED"
          echo "merged=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.merge.outputs.merged != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
