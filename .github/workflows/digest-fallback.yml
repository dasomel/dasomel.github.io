name: Digest Fallback Merge

# 보강 태스크가 draft PR 을 그대로 남겨두면 머지해 발행한다.
# 머지할 draft PR 이 없으면 아무 작업도 하지 않는다.

on:
  schedule:
    # 23:25 UTC = 08:25 KST. 발행은 오전이어야 한다.
    #
    # 예전 값 '0 8'(=17:00 KST)은 발행을 오후로 밀었고, 정시(top-of-hour)라
    # GitHub 스케줄 혼잡까지 겹쳐 실제 시작이 87분·127분 밀렸다(관측).
    # 그래서 실제 발행이 18:27·19:07 KST 였다.
    #
    # 앞의 daily-digest 는 21:40 UTC 예약에 지연 48~59분이 매우 일정해
    # (12회 관측) draft PR 이 늦어도 22:41 UTC 에는 존재한다.
    # 23:25 는 거기서 44분 이상 여유를 두면서 정시를 피한 값이다.
    # 이 간격이 보강 창이기도 하므로 더 당기면 보강이 잘린다.
    - cron: '25 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # deploy.yml 을 workflow_dispatch 로 깨우기 위해 필요.
  actions: write

concurrency:
  group: digest-fallback
  cancel-in-progress: false

jobs:
  fallback-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge pending draft digest PR (if any)
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 대상은 제목의 날짜가 아니라 브랜치명(daily-digest/*)으로 찾는다.
          # 제목 기준으로 오늘 날짜를 매칭하면, digest 런이 KST 자정을 넘겨
          # 지연될 때 날짜가 어긋나 PR 을 영영 못 찾고 발행이 조용히 멈춘다.
          # (cron 21:40 UTC 대비 실제 시작이 ~50분씩 밀리는 것이 관측됐다.)
          # 브랜치 기준이면 밀린 날짜의 미발행 다이제스트도 함께 회수된다.
          # gh 실패를 "머지할 것 없음"으로 오해하면 발행이 조용히 멈춘다. 명시적으로 구분한다.
          if ! gh pr list \
            --repo "$REPO" \
            --state open \
            --draft \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("daily-digest/"))]
                  | sort_by(.headRefName)[] | "\(.number)\t\(.headRefName)"' > /tmp/digest-prs.txt; then
            echo "::error::gh pr list 실패 — 목록을 가져오지 못했다."
            exit 1
          fi
          echo "대상:"
          cat /tmp/digest-prs.txt

          # 오래된 것부터(브랜치명=날짜 오름차순) 머지해 발행 순서를 보존한다.
          # mapfile 은 bash 4+ 전용이라 while-read 로 둔다 — 로컬(bash 3.2) 검증도 가능해진다.
          COUNT=0
          while IFS=$'\t' read -r NUM BRANCH; do
            [ -z "$NUM" ] && continue
            DATE="${BRANCH#daily-digest/}"

            echo "PR #${NUM} (${BRANCH}) — ready 전환 후 머지..."
            gh pr ready "$NUM" --repo "$REPO"
            gh pr merge "$NUM" \
              --repo "$REPO" \
              --squash \
              --delete-branch \
              --subject "📰 데일리 테크 다이제스트 ${DATE} (fallback — AI 보강 없이 발행)"
            COUNT=$((COUNT + 1))
          done < /tmp/digest-prs.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "머지할 draft 다이제스트 PR 이 없다. 이미 발행됐거나 수집 결과가 없다."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "완료: ${COUNT}건 머지."

      # GITHUB_TOKEN 이 만든 push 는 다른 워크플로를 트리거하지 않는다(재귀 실행 방지).
      # 따라서 위 머지만으로는 deploy.yml 이 돌지 않아 사이트가 갱신되지 않는다.
      # workflow_dispatch 는 이 제약의 예외이므로 명시적으로 깨워 준다.
      - name: Trigger Pages deploy
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
