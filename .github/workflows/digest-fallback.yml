name: Digest Fallback Merge

# Scheduled by scheduler.yml. This workflow remains independently dispatchable.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: digest-fallback
  cancel-in-progress: false

jobs:
  fallback-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Find pending digest PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # D4: Include ready PRs so a failed merge after `pr ready` can retry.
          # Cost: recheck open digest PRs; already-published replacements remain manual.
          if ! gh pr list --repo "$REPO" --state open --json number,headRefName,isDraft \
            --jq '[.[] | select(.headRefName | test("^daily-digest/[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort_by(.headRefName)[] | "\(.number)\t\(.headRefName)\t\(.isDraft)"' > /tmp/digest-prs.txt; then
            echo "::error::gh pr list 실패 — 자동 발행을 중단한다."
            exit 1
          fi
          cat /tmp/digest-prs.txt

      - name: Gate and merge fully enriched digests
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=0
          BLOCKED=0
          while IFS=$'\t' read -r NUM BRANCH IS_DRAFT; do
            [ -z "$NUM" ] && continue
            DATE="${BRANCH#daily-digest/}"
            git fetch origin "$BRANCH" --quiet
            git checkout --detach "origin/$BRANCH"
            VERIFIED_HEAD="$(git rev-parse HEAD)"
            if ! bun scripts/check-enrichment.mjs --strict --date "$DATE"; then
              echo "::warning::PR #${NUM} (${DATE}) — AI enrichment 미완료."
              BLOCKED=$((BLOCKED + 1))
              continue
            fi
            git fetch origin main --quiet
            git checkout --detach origin/main
            if [ -f "src/content/posts/daily-digest-${DATE}.md" ]; then
              echo "::warning::PR #${NUM} (${DATE}) — 이미 main에 발행됨."
              BLOCKED=$((BLOCKED + 1))
              continue
            fi
            if [ "$IS_DRAFT" = "true" ]; then
              gh pr ready "$NUM" --repo "$REPO"
            fi
            gh pr merge "$NUM" --repo "$REPO" --match-head-commit "$VERIFIED_HEAD" --squash --delete-branch --subject "📰 데일리 테크 다이제스트 ${DATE}"
            COUNT=$((COUNT + 1))
          done < /tmp/digest-prs.txt
          echo "merged=$COUNT blocked=$BLOCKED"
          echo "merged=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Record deployment handoff
        if: steps.merge.outputs.merged != '0'
        run: echo "Digest merge complete; deploy.yml is triggered by workflow_run."
