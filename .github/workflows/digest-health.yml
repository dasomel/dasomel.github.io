name: Digest Health

on:
  workflow_dispatch:
    inputs:
      date:
        description: '검사할 날짜 (YYYY-MM-DD, KST). 비우면 오늘.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify Bun version
        run: bun --version
      - name: Check enrichment coverage
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            bun scripts/check-enrichment.mjs --date "$INPUT_DATE"
          else
            bun scripts/check-enrichment.mjs
          fi
