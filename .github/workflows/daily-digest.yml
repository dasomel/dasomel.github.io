name: Daily Tech Digest

on:
  schedule:
    # 20:20 UTC = 05:20 KST (next day). Publication targets 07:00 KST, and the
    # merge step (digest-fallback) needs the draft PR to already exist when it
    # fires, so collection has to finish well before it.
    #
    # Observed delay for this workflow is tight and stable: 53/58/63 min
    # (min/p50/max over 14 scheduled runs), so the PR exists by ~21:25 UTC at
    # worst. digest-fallback fires no earlier than ~22:04 UTC, leaving ~39 min
    # of margin — the same cushion the previous 21:40/23:25 pairing had.
    #
    # Deliberately OFF the top-of-hour (and off 00:00 UTC, the single most
    # congested cron slot) to reduce GitHub's scheduled-run delay.
    # The 24h rolling collection window moves with it, so coverage is unchanged.
    - cron: '20 20 * * *'
    # Backstop slot. GitHub's scheduled runs are not merely late — a slot can
    # slip by hours: on 2026-08-07 the 20:20Z run did not start until 00:56Z
    # (276 min). A slot that never lands means no digest at all that day, and
    # deploy.yml's own backstop cannot recover it because there is no PR to
    # merge. This second slot fills that hole.
    #
    # It is free on a normal day: the guard step below turns it into a no-op
    # once the date is published or a PR for it already exists.
    - cron: '55 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 발행됐거나 PR 이 열려 있어도 강제로 다시 수집한다'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# Never let two digest runs (e.g. a delayed cron + a manual dispatch) overlap.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Bound the known feed-collection hang risk so a stuck run can't burn minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 같은 날짜를 두 번 발행하지 못하게 막는 관문. 수집보다 먼저 온다.
      #
      # 2026-08-07 사고: 수동 dispatch 로 발행을 끝낸 직후, 276분 지연된 예약 런이
      # 뒤늦게 떠서 같은 날짜를 다시 수집하고(23건 → 18건) 삭제된 브랜치를 되살려
      # PR 을 새로 만들었다. 예약 fallback 이 그것을 머지해 이미 발행된 다이제스트를
      # 통째로 갈아치웠다. 워크플로는 전부 초록이었다 — 내용이 바뀐 걸 아무도 모른다.
      # 백스톱 cron 을 추가하면 이 경합이 더 잦아지므로 관문이 먼저 있어야 한다.
      - name: Guard against double publication
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # 잘못 만든 다이제스트를 사람이 다시 돌릴 수 있어야 한다 — 탈출구.
          if [ "$FORCE" = "true" ]; then
            echo "force=true — 관문을 건너뛰고 다시 수집한다."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "src/content/posts/daily-digest-${DATE}.md" ]; then
            echo "::notice::${DATE} 다이제스트는 이미 main 에 있다. 이번 실행은 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gh 실패를 "PR 없음"으로 오해하면 그대로 이중 발행이 된다. 명시적으로 구분한다.
          if ! OPEN="$(gh pr list --repo "$REPO" --state open \
                --head "daily-digest/${DATE}" --json number --jq '.[].number')"; then
            echo "::error::gh pr list 실패 — 이중 발행을 막을 수 없으므로 중단한다."
            exit 1
          fi
          if [ -n "$OPEN" ]; then
            echo "::notice::${DATE} PR(#${OPEN}) 이 이미 열려 있다. 이번 실행은 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${DATE} 미발행 — 수집을 진행한다."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: Collect RSS feeds
        if: steps.guard.outputs.skip == 'false'
        run: npm run digest:collect

      - name: Generate digest posts
        if: steps.guard.outputs.skip == 'false'
        run: npm run digest

      - name: Check for new posts
        id: changes
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ -n "$(git status --porcelain src/content/posts)" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            # 관문이 계산한 날짜를 그대로 쓴다. 여기서 date 를 다시 부르면 실행이
            # KST 자정을 걸칠 때 관문이 검사한 날짜와 어긋날 수 있다.
            echo "date=${{ steps.guard.outputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No new digest files — nothing to commit."
          fi

      - name: Build PR body
        if: steps.changes.outputs.created == 'true'
        id: body
        run: |
          DATE="${{ steps.changes.outputs.date }}"
          {
            echo "Automated daily tech digest for **${DATE}**."
            echo ""
            echo "Curated from Kubernetes, CNCF, The New Stack, AWS, Google Cloud, OpenAI, Hugging Face, HashiCorp, and Grafana feeds."
            echo ""
            echo "## Headlines"
            # Pull each '### ' headline from the Korean digest as a checklist.
            grep -h '^### ' "src/content/posts/daily-digest-${DATE}.md" \
              | sed 's/^### /- /' || true
            echo ""
            echo "---"
            echo "_🤖 Generated automatically. Review summaries against the original sources before merging._"
          } > pr-body.md
          echo "Generated PR body:"
          cat pr-body.md

      - name: Create Pull Request
        if: steps.changes.outputs.created == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: daily-digest/${{ steps.changes.outputs.date }}
          base: main
          commit-message: "docs: daily tech digest - ${{ steps.changes.outputs.date }}"
          title: "📰 Daily Digest - ${{ steps.changes.outputs.date }}"
          body-path: pr-body.md
          draft: true
          add-paths: |
            src/content/posts/*.md
            src/content/posts/.digest-data/*.json
          delete-branch: true
