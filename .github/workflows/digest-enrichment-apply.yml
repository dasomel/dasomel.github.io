name: Apply Digest AI Enrichment

on:
  push:
    paths:
      - 'src/content/posts/.digest-data/*-ai.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest-enrichment-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Merge AI enrichment and regenerate digests
        run: bun scripts/merge-digest-enrichment.mjs

      - name: Commit generated digest updates
        run: |
          if git diff --quiet; then
            echo 'No digest updates to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/.digest-data src/content/posts/daily-digest-*.md
          git commit -m '✨ apply AI digest enrichment'
          git push origin HEAD:main
