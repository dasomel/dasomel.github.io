name: Temporary OSS Portfolio Build

on:
  push:
    branches:
      - feat/openforge-portfolio-dashboard

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/openforge-portfolio-dashboard
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --no-progress
      - run: bun test
      - run: bun run lint
      - run: bun run build
