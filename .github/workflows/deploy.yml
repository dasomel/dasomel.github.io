name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 02:40 UTC (= 11:40 KST) 백스톱.
    # 봇 커밋은 `on: push` 를 트리거하지 못하므로 다이제스트/행사 워크플로가
    # 배포 dispatch 에 실패해도 하루 한 번은 main 최신 상태가 발행되게 한다.
    - cron: '40 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lock:
    name: cross-repo CI lock
    runs-on: ubuntu-latest
    outputs:
      acquired: ${{ steps.acquire.outputs.acquired }}
    steps:
      - name: Acquire shared execution lock
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_REPO: dasomel/dasomel.github.io
          LOCK_BRANCH: ci-cross-repo-lock
          LOCK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            if ! gh api "repos/${LOCK_REPO}/git/ref/heads/${LOCK_BRANCH}" >/dev/null 2>&1; then
              if gh api --method POST "repos/${LOCK_REPO}/git/refs" \
                -f "ref=refs/heads/${LOCK_BRANCH}" \
                -f "sha=${LOCK_SHA}" >/dev/null 2>&1; then
                echo "acquired=true" >> "$GITHUB_OUTPUT"
                echo "Cross-repo lock acquired"
                exit 0
              fi
            fi
            echo "Cross-repo lock busy (attempt ${attempt}/90); waiting 10s"
            sleep 10
          done

          echo "::error::Timed out waiting for cross-repo execution lock"
          exit 1

  build:
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  unlock:
    name: release cross-repo CI lock
    if: always()
    needs: [lock, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Release shared execution lock
        if: needs.lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_REPO: dasomel/dasomel.github.io
          LOCK_BRANCH: ci-cross-repo-lock
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${LOCK_REPO}/git/refs/heads/${LOCK_BRANCH}" || true
