name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Digest Fallback Merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Do not add workflow-level concurrency here. GitHub keeps at most one pending
# run per concurrency group, so a newer push replaces the older pending run
# even when cancel-in-progress is false. The explicit lock job below already
# serializes Pages builds without turning normal rapid commits into cancelled
# workflow runs.

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lock:
    name: cross-repo CI lock
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      acquired: ${{ steps.acquire.outputs.acquired }}
    steps:
      - name: Acquire shared execution lock
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_REPO: dasomel/dasomel.github.io
          LOCK_BRANCH: ci-cross-repo-lock
          LOCK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          stale_after_seconds=1200

          for attempt in $(seq 1 90); do
            if ! gh api "repos/${LOCK_REPO}/git/ref/heads/${LOCK_BRANCH}" >/dev/null 2>&1; then
              if gh api --method POST "repos/${LOCK_REPO}/git/refs" \
                -f "ref=refs/heads/${LOCK_BRANCH}" \
                -f "sha=${LOCK_SHA}" >/dev/null 2>&1; then
                echo "acquired=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              lock_sha="$(gh api "repos/${LOCK_REPO}/git/ref/heads/${LOCK_BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
              lock_date="$(gh api "repos/${LOCK_REPO}/commits/${lock_sha}" --jq '.commit.committer.date' 2>/dev/null || true)"

              if [[ -n "$lock_date" ]]; then
                lock_epoch="$(date -d "$lock_date" +%s)"
                now_epoch="$(date +%s)"
                age=$((now_epoch - lock_epoch))

                if (( age > stale_after_seconds )); then
                  echo "::warning::Removing stale CI lock (${age}s old)"
                  gh api --method DELETE "repos/${LOCK_REPO}/git/refs/heads/${LOCK_BRANCH}" >/dev/null 2>&1 || true
                  continue
                fi
              fi
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for cross-repo execution lock"
          exit 1

  build:
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify Bun version
        run: bun --version
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Refresh OSS development pulse for this build
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if bun scripts/refresh-project-metadata.mjs; then
            echo "Development Pulse refreshed for Pages artifact."
          else
            echo "::warning::Development Pulse refresh failed; building with last checked-in metadata."
          fi

      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  unlock:
    name: release cross-repo CI lock
    if: always()
    needs: [lock, build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Release shared execution lock
        if: needs.lock.outputs.acquired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_REPO: dasomel/dasomel.github.io
          LOCK_BRANCH: ci-cross-repo-lock
        run: gh api --method DELETE "repos/${LOCK_REPO}/git/refs/heads/${LOCK_BRANCH}" || true
