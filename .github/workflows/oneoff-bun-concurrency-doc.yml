name: One-off Bun concurrency doc update

on:
  push:
    branches:
      - docs/bun-deploy-concurrency

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update articles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ko = Path('src/content/posts/bun-migration-ci-proof.md')
          en = Path('src/content/posts/bun-migration-ci-proof-en.md')

          ko_text = ko.read_text()
          ko_marker = '## 12. 마이그레이션에서 얻은 engineering lesson'
          ko_section = '''## 12. 연속된 main 변경과 Deploy 취소도 배포 모델의 일부다\n\nBun 전환 이후 CI/CD를 정리하는 과정에서 `main`에 짧은 간격으로 여러 변경이 들어오면서 이전 GitHub Pages Deploy run이 `cancelled`되고 최신 revision의 Deploy가 이어지는 상황도 확인했습니다.\n\n실제 흐름은 다음과 같습니다.\n\n<Mermaid chart={`flowchart TD\n    classDef commit fill:#f8fafc,stroke:#94a3b8,color:#334155,stroke-width:1px\n    classDef deploy fill:#ecfeff,stroke:#06b6d4,color:#155e75,stroke-width:1.5px\n    classDef cancel fill:#fef2f2,stroke:#ef4444,color:#991b1b,stroke-width:1.5px\n    classDef success fill:#ecfdf5,stroke:#10b981,color:#065f46,stroke-width:1.5px\n\n    A[Commit A on main] --> B[Deploy A]\n    C[Commit B on main] --> D[Deploy B]\n    B --> E[Deploy A cancelled]\n    D --> F[Deploy B succeeds]\n    class A,C commit\n    class B,D deploy\n    class E cancel\n    class F success\n`} />\n\n여기서 중요한 점은 `cancelled`가 이전 코드가 삭제되었다는 뜻은 아니라는 것입니다. `main`이 선형적으로 갱신되는 저장소에서는 보통 `Commit B`가 `Commit A`의 변경을 포함하므로, 이전 revision의 배포 작업을 중단하고 최신 revision을 최종 배포 대상으로 선택하는 흐름으로 이해해야 합니다.\n\n따라서 Deploy run을 확인할 때는 단순히 `cancelled`만 보고 장애라고 판단하지 않고 다음을 함께 확인해야 합니다.\n\n| 확인 항목 | 판단 기준 |\n| --- | --- |\n| 이전 Deploy | `cancelled`인지 |\n| 최신 main commit | 더 새로운 revision이 존재하는지 |\n| 최신 Deploy | build와 deploy가 성공했는지 |\n\n이번 사례에서도 이전 Deploy #364가 취소된 뒤 최신 commit `76e1a3e`를 대상으로 Deploy #365가 새로 실행됐고, production build는 정상 완료됐습니다.\n\n이 구조는 중복 결과를 무작정 덮어쓰는 것보다 **최신 main revision을 최종 배포 상태로 수렴시키는 방식**에 가깝습니다. 다만 여러 배포가 서로 독립적인 artifact를 생성하는 시스템이라면 concurrency 정책을 별도로 검토해야 합니다.\n\n---\n\n'''
          if ko_marker not in ko_text:
              raise SystemExit('Korean insertion marker not found')
          if '## 12. 연속된 main 변경과 Deploy 취소도 배포 모델의 일부다' not in ko_text:
              ko_text = ko_text.replace(ko_marker, ko_section + ko_marker, 1)
              ko.write_text(ko_text)

          en_text = en.read_text()
          en_marker = '## 12. Engineering lessons'
          en_section = '''## 12. Sequential main changes and cancelled deploy runs are part of the deployment model\n\nWhile cleaning up the Bun-based CI/CD flow, I also observed a case where a newer `main` revision arrived while an earlier GitHub Pages deployment was still running. The earlier deploy run became `cancelled`, and a new deployment started for the latest revision.\n\nThe observed flow looked like this:\n\n<Mermaid chart={`flowchart TD\n    classDef commit fill:#f8fafc,stroke:#94a3b8,color:#334155,stroke-width:1px\n    classDef deploy fill:#ecfeff,stroke:#06b6d4,color:#155e75,stroke-width:1.5px\n    classDef cancel fill:#fef2f2,stroke:#ef4444,color:#991b1b,stroke-width:1.5px\n    classDef success fill:#ecfdf5,stroke:#10b981,color:#065f46,stroke-width:1.5px\n\n    A[Commit A on main] --> B[Deploy A]\n    C[Commit B on main] --> D[Deploy B]\n    B --> E[Deploy A cancelled]\n    D --> F[Deploy B succeeds]\n    class A,C commit\n    class B,D deploy\n    class E cancel\n    class F success\n`} />\n\nA `cancelled` run does not mean the earlier code was deleted. In a linear `main` history, the newer revision normally contains the previous revision's changes, so the earlier deployment work can be stopped and the latest revision can become the final deployment target.\n\nWhen diagnosing a deploy run, check all three signals together:\n\n| Check | What it tells you |\n| --- | --- |\n| Previous deployment | Whether it was `cancelled` |\n| Newer main revision | Whether a newer commit exists |\n| Latest deployment | Whether the newest build and deployment succeeded |\n\nIn this case, the previous Deploy #364 was cancelled after a newer commit appeared, and Deploy #365 started for `76e1a3e`. Its production build completed successfully.\n\nThis is better described as **converging the deployment state on the latest `main` revision**, rather than blindly overwriting a previous result. Different systems that publish independent artifacts may need a different concurrency policy.\n\n---\n\n'''
          if en_marker not in en_text:
              raise SystemExit('English insertion marker not found')
          if '## 12. Sequential main changes and cancelled deploy runs are part of the deployment model' not in en_text:
              en_text = en_text.replace(en_marker, en_section + en_marker, 1)
              en.write_text(en_text)
          PY

      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/bun-migration-ci-proof.md src/content/posts/bun-migration-ci-proof-en.md .github/workflows/oneoff-bun-concurrency-doc.yml
          git rm .github/workflows/oneoff-bun-concurrency-doc.yml
          git commit -m "docs: clarify deploy concurrency behavior in Bun migration post"
          git push
