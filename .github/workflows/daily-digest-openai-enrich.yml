name: Daily Digest AI Enrichment

on:
  schedule:
    # 21:30 UTC = 06:30 KST. The collector normally creates the draft PR
    # around 05:20 KST, leaving a recovery slot before the 07:00 publication target.
    - cron: '30 21 * * *'
    # Backstop: 21:55 UTC = 06:55 KST.
    - cron: '55 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'KST date to enrich (YYYY-MM-DD; blank = today)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-digest-ai-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Resolve target date and digest PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          REPO: ${{ github.repository }}
        run: |
          DATE="$INPUT_DATE"
          if [ -z "$DATE" ]; then
            DATE="$(TZ=Asia/Seoul date +%F)"
          fi
          if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::invalid date: $DATE"
            exit 1
          fi

          BRANCH="daily-digest/${DATE}"
          PR="$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "::notice::No open digest PR for ${DATE}; the collector has not produced one yet."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "src/content/posts/.digest-data/${DATE}.json" ]; then
            echo "::notice::No digest JSON for ${DATE}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Target: PR #$PR ($BRANCH)"

      - name: Checkout digest PR branch
        if: steps.target.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Setup Node
        if: steps.target.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.target.outputs.skip == 'false'
        run: npm ci

      - name: Enrich digest with OpenAI
        if: steps.target.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          DATE: ${{ steps.target.outputs.date }}
        run: node scripts/enrich-openai.mjs --date "$DATE"

      - name: Regenerate bilingual digest
        if: steps.target.outputs.skip == 'false'
        env:
          DATE: ${{ steps.target.outputs.date }}
        run: npm run digest -- --enrich --date "$DATE"

      - name: Validate enrichment
        if: steps.target.outputs.skip == 'false'
        env:
          DATE: ${{ steps.target.outputs.date }}
        run: npm run digest:check -- --date "$DATE"

      - name: Commit and push enrichment
        if: steps.target.outputs.skip == 'false'
        env:
          DATE: ${{ steps.target.outputs.date }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/posts/.digest-data/${DATE}.json" \
                  "src/content/posts/daily-digest-${DATE}.md" \
                  "src/content/posts/daily-digest-${DATE}-en.md"
          if git diff --cached --quiet; then
            echo "No enrichment changes to commit."
            exit 0
          fi
          git commit -m "docs: enrich daily tech digest - ${DATE}"
          git push origin "HEAD:${BRANCH}"

      - name: Report
        if: steps.target.outputs.skip == 'false'
        run: echo "OpenAI enrichment completed for PR #${{ steps.target.outputs.pr }}; fallback merge will publish the validated PR."
