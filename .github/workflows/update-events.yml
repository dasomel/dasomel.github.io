name: Update Seoul Events

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify Bun version
        run: bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress
      - name: Fetch Seoul events
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: bun scripts/fetch-seoul-events.mjs
      - name: Fetch nationwide festivals
        id: festivals
        continue-on-error: true
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: bun scripts/fetch-festivals.mjs
      - name: Preserve previous festivals when fetch failed
        if: steps.festivals.outcome == 'failure'
        run: |
          git show HEAD:src/content/events/data.json > "${RUNNER_TEMP}/prev-events.json"
          PREV="${RUNNER_TEMP}/prev-events.json" bun -e '
            const fs = require("fs");
            const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            const OUT = "src/content/events/data.json";
            const prev = JSON.parse(fs.readFileSync(process.env.PREV, "utf-8"));
            const cur = JSON.parse(fs.readFileSync(OUT, "utf-8"));
            const isTour = (e) => String(e.id || "").startsWith("tour-");
            const festivals = (prev.events || []).filter(isTour);
            const seoul = (cur.events || []).filter((e) => !isTour(e));
            const merged = new Map();
            for (const e of [...seoul, ...festivals]) merged.set(e.id, e);
            const upcoming = [...merged.values()].filter((e) => !e.endDate || e.endDate >= today).sort((a, b) => (a.startDate > b.startDate ? 1 : -1));
            fs.writeFileSync(OUT, JSON.stringify({ updatedAt: new Date().toISOString(), events: upcoming }, null, 2) + "\n");
          '
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/content/events/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            COUNT=$(bun -e "const d=JSON.parse(await Bun.file('./src/content/events/data.json').text()); console.log(d.events.length)")
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          COUNT: ${{ steps.changes.outputs.count }}
          FESTIVALS_OUTCOME: ${{ steps.festivals.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/events/data.json
          SUFFIX=""
          if [ "$FESTIVALS_OUTCOME" = "failure" ]; then SUFFIX=" [축제 수집 실패 — 직전 축제 데이터 유지]"; fi
          git commit -m "chore(events): 서울 행사 데이터 업데이트 — ${COUNT}건 ($(TZ=Asia/Seoul date +%F))${SUFFIX}"
          git push
      - name: Trigger Pages deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
      - name: Surface festivals fetch failure
        if: steps.festivals.outcome == 'failure'
        run: |
          echo "::warning::전국 축제 데이터 수집 실패 — 서울 행사와 직전 축제 데이터는 유지했다."
