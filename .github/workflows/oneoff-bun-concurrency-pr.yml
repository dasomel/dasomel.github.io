name: One-off Bun concurrency PR doc update

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'docs/bun-deploy-concurrency'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Append deploy concurrency section
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ko = Path('src/content/posts/bun-migration-ci-proof.md')
          en = Path('src/content/posts/bun-migration-ci-proof-en.md')

          ko_text = ko.read_text()
          ko_heading = '## 12. 연속된 main 변경과 Deploy 취소도 배포 모델의 일부다'
          ko_section = '''\n\n## 12. 연속된 main 변경과 Deploy 취소도 배포 모델의 일부다\n\nBun 전환 이후 CI/CD를 정리하는 과정에서 `main`에 짧은 간격으로 여러 변경이 들어오면서 이전 GitHub Pages Deploy run이 `cancelled`되고 최신 revision의 Deploy가 이어지는 상황도 확인했습니다.\n\n<Mermaid chart={`flowchart TD\n    classDef commit fill:#f8fafc,stroke:#94a3b8,color:#334155,stroke-width:1px\n    classDef deploy fill:#ecfeff,stroke:#06b6d4,color:#155e75,stroke-width:1.5px\n    classDef cancel fill:#fef2f2,stroke:#ef4444,color:#991b1b,stroke-width:1.5px\n    classDef success fill:#ecfdf5,stroke:#10b981,color:#065f46,stroke-width:1.5px\n\n    A[Commit A on main] --> B[Deploy A]\n    C[Commit B on main] --> D[Deploy B]\n    B --> E[Deploy A cancelled]\n    D --> F[Deploy B succeeds]\n    class A,C commit\n    class B,D deploy\n    class E cancel\n    class F success\n`} />\n\n여기서 `cancelled`는 이전 코드가 삭제되었다는 뜻이 아닙니다. `main`이 선형적으로 갱신되는 저장소에서는 보통 최신 revision이 이전 변경을 포함하므로, 이전 revision의 배포 작업을 중단하고 최신 revision을 최종 배포 대상으로 선택하는 흐름으로 이해하는 것이 정확합니다.\n\n따라서 Deploy run을 확인할 때는 `cancelled`만 보고 장애라고 판단하지 않고 다음을 함께 확인해야 합니다.\n\n| 확인 항목 | 판단 기준 |\n| --- | --- |\n| 이전 Deploy | `cancelled`인지 |\n| 최신 main commit | 더 새로운 revision이 존재하는지 |\n| 최신 Deploy | build와 deploy가 성공했는지 |\n\n이번 사례에서도 Deploy #364가 취소된 뒤 최신 commit `76e1a3e`를 대상으로 Deploy #365가 실행됐고 production build는 정상 완료됐습니다.\n\n즉 이 동작은 기존 결과를 무작정 덮어쓰는 것보다 **최신 `main` revision으로 배포 상태를 수렴시키는 것**에 가깝습니다. 독립적인 artifact를 배포하는 시스템은 concurrency 정책을 별도로 검토해야 합니다.\n'''
          if ko_heading not in ko_text:
              ko.write_text(ko_text.rstrip() + ko_section + '\n')

          en_text = en.read_text()
          en_heading = '## 12. Sequential main changes and cancelled deploy runs are part of the deployment model'
          en_section = '''\n\n## 12. Sequential main changes and cancelled deploy runs are part of the deployment model\n\nWhile cleaning up the Bun-based CI/CD flow, I observed a case where a newer `main` revision arrived while an earlier GitHub Pages deployment was still running. The earlier run became `cancelled`, and a new deployment started for the latest revision.\n\n<Mermaid chart={`flowchart TD\n    classDef commit fill:#f8fafc,stroke:#94a3b8,color:#334155,stroke-width:1px\n    classDef deploy fill:#ecfeff,stroke:#06b6d4,color:#155e75,stroke-width:1.5px\n    classDef cancel fill:#fef2f2,stroke:#ef4444,color:#991b1b,stroke-width:1.5px\n    classDef success fill:#ecfdf5,stroke:#10b981,color:#065f46,stroke-width:1.5px\n\n    A[Commit A on main] --> B[Deploy A]\n    C[Commit B on main] --> D[Deploy B]\n    B --> E[Deploy A cancelled]\n    D --> F[Deploy B succeeds]\n    class A,C commit\n    class B,D deploy\n    class E cancel\n    class F success\n`} />\n\nA `cancelled` run does not mean the earlier code was deleted. In a linear `main` history, the newer revision normally contains the previous revision's changes, so the earlier deployment work can be stopped and the latest revision can become the final deployment target.\n\nWhen diagnosing a deployment, check all three signals together: the previous run's `cancelled` state, the presence of a newer `main` revision, and the outcome of the latest deployment.\n\nIn this case, Deploy #364 was cancelled after a newer commit appeared, and Deploy #365 started for `76e1a3e`; its production build completed successfully.\n\nThis is better described as **converging deployment state on the latest `main` revision** than as blindly overwriting a previous result. Systems publishing independent artifacts may need a different concurrency policy.\n'''
          if en_heading not in en_text:
              en.write_text(en_text.rstrip() + en_section + '\n')
          PY

      - name: Commit article changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/bun-migration-ci-proof.md src/content/posts/bun-migration-ci-proof-en.md
          git commit -m "docs: clarify deploy concurrency behavior in Bun migration post"
          git push
