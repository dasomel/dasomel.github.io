name: Refresh OSS project metadata

on:
  # Unified scheduler is the normal trigger. This push hook is intentionally
  # narrow: it bootstraps immediately when the collector/workflow itself changes,
  # so newly added pulse fields do not stay empty until the next scheduled slot.
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-project-metadata.mjs'
      - '.github/workflows/project-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify Bun version
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Refresh repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/refresh-project-metadata.mjs

      - name: Publish generated development pulse
        run: |
          if git diff --quiet -- src/data/project-repo-meta.json; then
            echo 'No project metadata changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/project-repo-meta.json
          git commit -m 'chore: refresh OSS project development pulse'

          # Another maintenance job may have advanced main while metadata was
          # being collected. Rebase the generated-data-only commit and retry once.
          git pull --rebase origin main
          git push origin HEAD:main
